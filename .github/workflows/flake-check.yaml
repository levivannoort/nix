name: flake check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: parse + eval every output, and fail on formatting drift.
  eval:
    name: eval and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: check formatting
        run: make fmt-check

      - name: lint
        run: make lint

      - name: evaluate flake outputs
        run: nix flake check --all-systems --no-build --show-trace

  # The real check: darwin hosts can only be built on macOS.
  build-darwin:
    name: build ${{ matrix.host }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        host: [lpws, apws]
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: build ${{ matrix.host }}
        run: nix build ".#darwinConfigurations.${{ matrix.host }}.system" --show-trace

  build-nixos:
    name: build nixos-vm
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: build nixos-vm
        run: nix build ".#nixosConfigurations.nixos-vm.config.system.build.toplevel" --show-trace
